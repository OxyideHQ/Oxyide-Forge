# Oxyide Forge on Render (M16.2).
#
# Render Blueprint: one web service + one managed PostgreSQL database.
# Apply with `render blueprint launch` or connect this repository in the
# Render dashboard and select this file.
#
# Build/start mirror the repository's own commands (package.json):
#   build:   npm ci && npx prisma generate && npm run build
#   start:   node dist/main.js
# Migrations run as a SEPARATE pre-deploy command (single-run, before the
# service starts serving) — never from multi-replica startup, never on every
# boot. See docs/deployment.md § "Platform deployment examples".
#
# No real secrets in this file. Render injects DATABASE_URL from the managed
# database (fromDatabase). Generate JWT_SECRET with:
#   openssl rand -base64 48
# then set it in the Render dashboard (Environment > Secret Files or Env Vars).

services:
  - type: web
    name: oxyide-forge
    runtime: node
    # Node 20 to match package.json engines (>=20.19.0) and Dockerfile.
    env: node
    buildCommand: npm ci && npx prisma generate && npm run build
    # Pre-deploy: exactly one migration run before the new revision serves.
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/main.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: oxyide-forge-db
          property: connectionString
      # APP_BASE_URL must be https:// in production (config refuses http://).
      # Replace with the service's public URL after first deploy.
      - key: APP_BASE_URL
        value: https://oxyide-forge.onrender.com
      # JWT_SECRET: set in the dashboard, minimum 32 characters. Never commit.
      - key: JWT_SECRET
        sync: false
      # Optional: METRICS_ENABLED=true exposes /metrics (Prometheus scrape).
      - key: METRICS_ENABLED
        value: 'false'

databases:
  - name: oxyide-forge-db
    databaseName: oxyide_forge
    user: oxyide_forge
    # Render manages TLS; DATABASE_URL from fromDatabase includes sslmode.
