# Oxyide Forge on Fly.io (M16.2).
#
# Deploy with:
#   fly launch --no-deploy        # first time: creates app + postgres
#   fly secrets set JWT_SECRET="$(openssl rand -base64 48)"
#   fly secrets set APP_BASE_URL="https://<app-name>.fly.dev"
#   fly deploy                    # builds from Dockerfile, runs release step
#
# Build uses the repository Dockerfile (two-stage node:20-alpine, non-root).
# Migrations run in [deploy].release_command: exactly one run per deploy,
# before the new Machines receive traffic — never from multi-Machine startup.
# See docs/deployment.md § "Platform deployment examples".
#
# No real secrets in this file. All credentials go in `fly secrets`.

app = "oxyide-forge"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Single-run migration gate. Fails the deploy if migrations fail.
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  LOG_LEVEL = "info"
  METRICS_ENABLED = "false"
  # DATABASE_URL is deliberately absent: attach a managed database with
  #   fly postgres attach --app <app-name>
  # then edit that secret so it ends with `?sslmode=require`:
  #   DATABASE_URL="postgres://<user>:<pass>@<host>:5432/<db>?sslmode=require"
  # Forge refuses to boot under NODE_ENV=production without sslmode=require —
  # this is enforced by src/config/env.schema.ts, so an unattached or
  # sslmode-less URL fails at startup with a named field rather than silently
  # connecting without TLS.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    # Readiness: only route traffic when dependencies are usable.
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health/ready"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
